services:
  mysql:
    image: mysql:8.4
    container_name: leave-mysql
    environment:
      MYSQL_DATABASE: leavedb
      MYSQL_USER: leave_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_locally}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
    ports:
      - "3306:3306"